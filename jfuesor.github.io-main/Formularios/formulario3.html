<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Formularios restaurante">
<meta name="keywords" content="restaurante, reserva, contacto, reseña">
<title>Formularios Restaurante</title>
<link rel="stylesheet" href="styles3.css">
</head>
<body>
<main class="contenedor-restaurante">
<section class="caja-restaurante">
<h1>Haz una reserva</h1>
<form class="form-reserva">
<input type="text" placeholder="Su nombre">
<input type="number" placeholder="Número de clientes">
<input type="email" placeholder="Su correo electrónico">
<input type="tel" placeholder="Su teléfono">
<input type="date">
<input type="time">
<textarea placeholder="Su mensaje"></textarea>
<button type="submit">SOLICITAR RESERVA</button>
</form>
</section>
<section class="caja-restaurante">
<h1>Envíenos su mensaje</h1>
<form class="form-contacto">
<div class="fila-contacto">
<input type="text" placeholder="Su nombre">
<input type="email" placeholder="Su correo electrónico">
<input type="tel" placeholder="su teléfono">
</div>
<input type="text" placeholder="Asunto">
<textarea maxlength="500" placeholder="Su mensaje"></textarea>
<button type="submit">ENVIAR</button>
</form>
</section>
<section class="caja-restaurante">
<h1>Deja una reseña del plato</h1>
<form class="form-resena">
<select>
<option>⭐</option>
<option>⭐⭐</option>
</select>
</main>
<input type="text" placeholder="Nombre del plato">
</option>
<option>⭐⭐⭐</option>
<option>⭐⭐⭐⭐</option>
<option>⭐⭐⭐⭐⭐</option>
<textarea placeholder="Escribe tu reseña"></textarea>
<button type="submit">PUBLICAR RESEÑA</button>
</form>
</section>
</body>
</html>
