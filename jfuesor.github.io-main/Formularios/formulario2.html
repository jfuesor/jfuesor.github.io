<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Formulario amigos de la informática" />
    <meta name="keywords" content="club informática, formulario" />
    <title>Formulario II</title>
    <link rel="stylesheet" href="style-form2.css" />
  </head>
  <body>
    <main class="contenedor-form2">
      <h1>
        Rellena el siguiente cuestionario para formar parte del club de "Amigos
        de la informática"
      </h1>
      <form>
        <section class="bloque-superior">
          <h2>Datos personales</h2>
          <label>Nombre:</label>
          <input type="text" />
          <label>Domicilio:</label>
          <input type="text" placeholder="calle, numero y localidad" />
          <label>País de origen:</label>
          <select>
            <option>España</option>
          </select>
          <label>Fecha de nacimiento:</label>
          <input type="date" />
          <label>Correo electrónico:</label>
          <input type="email" />

          <label>Teléfono:</label>
          <input type="tel" />
          <div class="estado-civil">
            <label>Estado civil:</label>
            <label><input type="radio" name="civil" /> Solter@</label>
            <label><input type="radio" name="civil" /> Casad@</label>
            <label><input type="radio" name="civil" /> Separad@</label>
            <label><input type="radio" name="civil" /> Viud@</label>
          </div>
          <div class="sexo">
            <label>Sexo:</label>
            <label><input type="radio" name="sexo" /> Hombre</label>
            <label><input type="radio" name="sexo" /> Mujer</label>
          </div>
        </section>
        <section class="bloque-inferior">
          <h2>Otra información de interés</h2>
          <label
            >Seleccione los componentes electrónicos con los que habitualmente
            trabajas:</label
          >
          <select multiple>
            <option>Móvil</option>
            <option>Tablet</option>
            <option>Ordenador</option>
            <option>Ebook</option>
          </select>
          <label>Seleccione tus actividades favoritas:</label>
          <div class="checkboxes">
            <label><input type="checkbox" /> Hacer deporte</label>
            <label><input type="checkbox" /> Salir con mis amigos</label>
            <label><input type="checkbox" /> Ver series, pelis,...</label>
            <label
              ><input type="checkbox" /> Realizar rutas de senderismo</label
            >
            <label><input type="checkbox" /> Ir al cine</label>
            <label><input type="checkbox" /> Escuchar música</label>
          </div>
          <label
            >Explique brevemente el motivo por el que desea ingresar en nuestro
            club:</label
          >
          <textarea></textarea>

          <label>Elige o escribe tu peli favorita:</label>
          <input type="text" />
        </section>
        <div class="botones2">
          <input type="submit" value="Enviar" />
          <input type="reset" value="Cancelar" />
        </div>
      </form>
    </main>
  </body>
</html>
